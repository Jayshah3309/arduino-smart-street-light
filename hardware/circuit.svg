<svg xmlns="http://www.w3.org/2000/svg" width="1100" height="860" viewBox="0 0 1100 860"><rect width="1100" height="860" fill="#f8fafc"/>
<text x="35" y="40" font-family="Arial,sans-serif" font-size="25" fill="#172554">SMART STREET LIGHT · PROPOSED REFERENCE CIRCUIT</text>
<text x="35" y="70" font-family="Arial,sans-serif" font-size="16" fill="#172554">Arduino UNO R3 · three independent LED zones · not verified against original hardware</text>
<rect x="40" y="200" width="240" height="420" rx="8" fill="#dbeafe" stroke="#94a3b8"/>
<text x="65" y="240" font-family="Arial,sans-serif" font-size="21" fill="#172554">ARDUINO UNO R3</text>
<text x="35" y="118" font-family="Arial,sans-serif" font-size="18" fill="#172554">5V</text>
<polyline points="45,130 1060,130" fill="none" stroke="#dc2626" stroke-width="2"/>
<text x="35" y="758" font-family="Arial,sans-serif" font-size="18" fill="#172554">GND</text>
<polyline points="45,770 1060,770" fill="none" stroke="#334155" stroke-width="2"/>
<text x="65" y="280" font-family="Arial,sans-serif" font-size="16" fill="#172554">A0 → divider junction</text>
<text x="65" y="320" font-family="Arial,sans-serif" font-size="16" fill="#172554">D2 ← IR 1 OUT</text>
<text x="65" y="360" font-family="Arial,sans-serif" font-size="16" fill="#172554">D4 ← IR 2 OUT</text>
<text x="65" y="400" font-family="Arial,sans-serif" font-size="16" fill="#172554">D7 ← IR 3 OUT</text>
<text x="65" y="460" font-family="Arial,sans-serif" font-size="16" fill="#172554">D3 → LED 1 resistor</text>
<text x="65" y="500" font-family="Arial,sans-serif" font-size="16" fill="#172554">D5 → LED 2 resistor</text>
<text x="65" y="540" font-family="Arial,sans-serif" font-size="16" fill="#172554">D6 → LED 3 resistor</text>
<text x="65" y="590" font-family="Arial,sans-serif" font-size="16" fill="#172554">5V → red supply rail</text>
<text x="65" y="620" font-family="Arial,sans-serif" font-size="16" fill="#172554">GND → ground rail</text>
<polyline points="370,130 370,185" fill="none" stroke="#dc2626" stroke-width="2"/>
<rect x="330" y="185" width="80" height="65" rx="8" fill="#fff" stroke="#94a3b8"/>
