<text x="35" y="815" font-family="Arial,sans-serif" font-size="16" fill="#172554">Every IR module shares 5V and GND. Each LED uses its own series resistor. USB powers the UNO.</text>
<text x="35" y="840" font-family="Arial,sans-serif" font-size="14" fill="#172554">Small indicator LEDs only. Pin-labelled nets define connectivity; see hardware/wiring.md for exact terminals.</text>
